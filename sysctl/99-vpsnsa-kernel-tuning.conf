# Fila máxima de conexões em escuta por socket (Prevenção de quedas em rajadas)
net.core.somaxconn = 65535

# Backlog máximo de conexões TCP em handshake SYN (Proteção contra SYN Flood)
net.ipv4.tcp_max_syn_backlog = 65535

# Faixa ampliada de portas efêmeras de saída (Evita esgotamento de portas locais)
net.ipv4.ip_local_port_range = 1024 65535

# Limite do sistema para descritores de arquivos abertos (Sockets + Arquivos)
fs.file-max = 2097152
